services:
  - type: web
    name: wayfind-rag-system
    runtime: python
    plan: free
    region: virginia
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: WAYFIND_ENV
        value: production
      - key: WAYFIND_DATA_DIR
        value: data
      - key: WAYFIND_ACCESS_USERNAME
        sync: false
      - key: WAYFIND_ACCESS_PASSWORD
        sync: false
